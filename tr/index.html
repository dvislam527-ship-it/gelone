<!DOCTYPE html>
<html lang="tr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">



<title>Depo ve Satış</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#eef2f5;--g1:#e6eef3;--g2:#c9d7e0;--panel:#fff;--panel2:#f2f6f9;--ink:#1c2630;--mute:#6a7a86;--line:#e2e8ed;--acc:#1677b8;--accink:#fff;--bad:#c9382e;--ok:#1d8a55;--warn:#9a6200;--dark:#252d35;color-scheme:light;box-sizing:border-box}
html{background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Noto Sans Arabic","UKIJ Tuz Tom","UKIJ Tuz",Tahoma,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit}
.bar{position:sticky;top:0;z-index:15;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;background:var(--g1)}
.tb{background:none;border:0;color:var(--ink);font-size:17px;padding:8px 4px;cursor:pointer;justify-self:start}
.tb.ic{justify-self:end;display:flex}
.tb svg,.rail svg,.ev .i svg,.pill svg,.dw svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pill{display:flex;align-items:center;gap:10px;background:#d3e2ea;border:0;border-radius:999px;padding:7px 18px 7px 12px;cursor:pointer;color:var(--ink);text-align:start;max-width:62vw}
.pill svg{color:#178a5f;flex:none}
.pill b{display:block;font-size:17px;font-weight:600;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill small{display:block;font-size:12px;color:var(--mute);line-height:1.2}
main{max-width:760px;margin:0 auto;padding:0 0 calc(env(safe-area-inset-bottom,0px) + 150px)}
#msg{color:var(--warn);font-size:13px;padding:6px 16px;background:#fff6e0}
#msg:empty{display:none}
/* ana ekran */
.home{background:linear-gradient(180deg,var(--g1) 0%,var(--g2) 100%);display:grid;grid-template-columns:52px 1fr;padding:6px 8px 26px 8px;min-height:300px}
.rail{display:flex;flex-direction:column;gap:12px;padding-top:24px;align-items:center}
.rail button{width:42px;height:42px;border-radius:50%;border:0;background:none;color:var(--acc);display:grid;place-items:center;cursor:pointer}
.rail button.on{background:rgba(22,119,184,.12)}
.viz{min-width:0}
.viz svg.donut{width:100%;max-width:440px;display:block;margin:0 auto}
.viz svg text{font-family:inherit}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:18px 8px 0}
.mini{background:rgba(255,255,255,.62);border-radius:14px;padding:11px 13px}
.mini small{display:block;color:var(--mute);font-size:12px}
.mini b{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:14px 6px 0}
.cal .h{font-size:11px;color:var(--mute);text-align:center}
.cal button{aspect-ratio:1;border:0;border-radius:10px;background:rgba(255,255,255,.55);color:var(--ink);font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:2px}
.cal button small{font-size:9px;color:inherit;opacity:.8;font-variant-numeric:tabular-nums}
.cal button.t{outline:2px solid var(--acc)}
.vtitle{font-size:13px;color:var(--mute);padding:14px 10px 0;text-align:center;letter-spacing:.02em}
.sheetl{background:#fff;border-radius:22px 22px 0 0;margin-top:-18px;position:relative;overflow:hidden;min-height:50vh}
.sumbar{background:var(--dark);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:16px 16px 12px;position:relative}
.sumbar:before{content:"";position:absolute;top:6px;right:50%;width:44px;height:4px;margin-right:-22px;border-radius:2px;background:#5b6670}
.sumbar b{font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.sumbar small{display:block;font-size:11px;color:#a7b2bb}
.mnav{display:flex;align-items:center;gap:2px;font-size:17px}
.mnav button{background:none;border:0;color:#a7b2bb;padding:0 6px;cursor:pointer;line-height:1;display:grid;place-items:center}
.srch{padding:10px 14px;border-bottom:1px solid var(--line)}
.tl{--c:120px}
.day{display:flex;justify-content:space-between;background:var(--panel2);padding:9px 16px;font-size:15px}
.day span:first-child{width:var(--c);text-align:end;color:#4a5762;text-transform:uppercase}
.day span:last-child{color:var(--acc)}
.ev{display:grid;grid-template-columns:var(--c) 40px 1fr;align-items:center;padding:12px 16px 12px 0;cursor:default;background:linear-gradient(var(--line),var(--line)) left calc(var(--c) + 20px) top 0/1px 100% no-repeat}
.ev.tap{cursor:pointer}.ev.tap:active{background-color:var(--panel2)}
.ev .a{text-align:end;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ev .a.m{color:var(--bad)}.ev .a.p{color:var(--ok)}
.ev .i{display:grid;place-items:center;background:#fff;width:28px;height:28px;margin:0 auto;color:#45535e;border-radius:50%}
.ev .t{min-width:0}
.ev .t b{font-weight:600;font-size:15px;text-transform:uppercase}
.ev .t time{color:var(--mute);font-size:13px;margin-inline-start:4px}
.ev .t div{color:var(--acc);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fab{display:none!important;position:fixed;right:max(18px,calc(50% - 362px));bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:58px;height:58px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:32px;line-height:1;box-shadow:0 6px 18px rgba(22,119,184,.35);cursor:pointer;z-index:12}
.acts{position:fixed;right:max(18px,calc(50% - 362px));bottom:calc(env(safe-area-inset-bottom,0px) + 88px);display:none;flex-direction:column;gap:8px;z-index:12;align-items:flex-start}
.acts.on{display:flex}
.acts button{border:0;background:#fff;color:var(--ink);padding:11px 16px;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);font-weight:600;cursor:pointer}
/* menü */
#dwbg{position:fixed;inset:0;background:rgba(20,30,40,.35);z-index:30;display:none}
#dwbg.on{display:block}
.dw{position:fixed;top:0;bottom:0;left:0;width:min(290px,82vw);background:#fff;z-index:31;transform:translateX(-102%);transition:transform .22s;padding:calc(env(safe-area-inset-top,0px) + 20px) 10px 20px;overflow:auto}

.dw h3{margin:0 10px 14px;font-size:20px}

.dw button.on{background:#e6f1f8;color:var(--acc);font-weight:600}
.dw svg{color:var(--acc)}
@media (prefers-reduced-motion:reduce){.dw{transition:none}}
/* alt sayfalar */
.sub{display:flex;align-items:center;gap:10px;padding:4px 12px 10px;background:var(--g1)}
.back{background:none;border:0;color:var(--acc);font-size:16px;cursor:pointer;padding:6px 2px}
.sub h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.pg{padding:14px 12px}
.card{background:var(--panel);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(30,50,70,.05)}
.card>h2{font-size:16px;font-weight:600;margin:0 0 10px}
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
label{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
input,select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--ink);width:100%;min-width:0}
input:focus,select:focus{border-color:var(--acc);outline:none;background:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn{padding:10px 18px;border:0;border-radius:10px;background:var(--acc);color:var(--accink);font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap}

.btn.g{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn.s{padding:7px 12px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.x{background:none;border:0;color:var(--bad);cursor:pointer;font-size:16px;padding:2px 6px}
.x.e{color:var(--acc)}.x.p{color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--panel);border-radius:14px;padding:13px 15px}
.stat small{color:var(--mute);display:block;font-size:13px}
.stat b{font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.hero{grid-column:1/-1;background:var(--dark);color:#fff;padding:18px 20px}
.hero small{color:#a7b2bb}
.hero b{font-size:clamp(28px,7vw,40px);font-weight:500}
.hero .sub2{display:flex;gap:20px;flex-wrap:wrap;margin-top:4px;font-size:14px;color:#d5dde3;font-variant-numeric:tabular-nums}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{text-align:start;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--mute);font-weight:500}
.r{text-align:end;font-variant-numeric:tabular-nums}
.low{color:var(--bad);font-weight:600}.pos{color:var(--ok)}.neg{color:var(--bad)}
.empty{color:var(--mute);padding:8px 0;font-size:14px}
.pos-grid{display:grid;grid-template-columns:1fr;gap:12px}
.scan{display:flex;gap:8px}
.scan input{font-size:18px;padding:12px 14px;background:#fff;border-color:#b9d3e6}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;max-height:240px;overflow:auto}
.chip{padding:8px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);cursor:pointer;font-size:14px;text-align:start}
.chip small{display:block;color:var(--mute);font-size:12px}
.cart-line{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer;font-size:16px}
.qty input{width:58px;text-align:center;padding:5px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 8px}
.total b{font-size:30px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.seg{display:inline-flex;background:var(--panel2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--mute);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.seg button.on{background:#fff;color:var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:13px;color:var(--mute);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.bars .b{display:grid;grid-template-columns:minmax(90px,30%) 1fr auto;gap:10px;align-items:center;font-size:14px;padding:4px 0}
.bars .t{height:10px;border-radius:5px;background:var(--panel2);overflow:hidden}
.bars .t i{display:block;height:100%;background:var(--acc)}
.sgbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}.sgbtn{flex:1 1 100%}.sgok{flex:1;color:var(--ok);font-weight:700;font-size:14px}
.sgpad{display:grid;gap:8px}.sgh{font-size:15px}.sgd{color:var(--bad);margin-top:2px}.sgt{margin:0;font-size:14px;line-height:1.45}.sgn{margin:0;font-size:12.5px;color:var(--mute)}
#sgc{width:100%;height:220px;background:#fff;border:2px dashed #8e9aa3;border-radius:12px;touch-action:none;display:block}
.sgrow{display:flex;gap:8px;flex-wrap:wrap}.sgcam{cursor:pointer}.sgprev{display:flex;align-items:center;gap:8px}.sgprev img{max-height:70px;border-radius:6px;border:1px solid var(--line)}
.shs{display:grid;gap:10px}.sht{font-size:16px}.shs a.btn{text-align:center;text-decoration:none}.shn{margin:0;font-size:13.5px;color:var(--mute);line-height:1.5}.shok{margin:0;color:var(--ok);font-weight:700}.shta{width:100%;min-height:150px;font:13px/1.4 monospace;box-sizing:border-box}.shpic{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;-webkit-touch-callout:default;user-select:auto}#shout{display:grid;gap:8px}#shout:empty{display:none}
.joinbox{display:grid;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px}.joinbox .foot{margin:0}
.jseg{display:flex;flex-wrap:wrap;gap:8px}.jseg button{flex:1 1 140px;display:grid;gap:2px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;cursor:pointer}.jseg button small{color:var(--mute);font-size:12px}.jseg button.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);background:var(--panel)}
.fis tr.grp td{background:#eef2f5;font-size:11px;font-weight:700;color:#1d2329;padding:4px 6px}
.plbtn{width:100%;margin:0 0 10px}.plset{display:grid;gap:10px;margin-bottom:12px}.plrow{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}.plrow>label{flex:1 1 140px;display:grid;gap:4px;font-size:13px;color:var(--mute)}.plrow label.chk{display:flex!important;flex-direction:row;align-items:center;justify-content:flex-start;gap:8px;flex:1 1 100%;color:var(--ink);text-align:start;font-size:14px}.plrow label.chk input{width:20px;height:20px;margin:0;flex:none}.plset .hint{font-size:13px;line-height:1.5}
.plh{font-size:12px;color:var(--mute)}.plh b{color:var(--ok)}
.pled summary{cursor:pointer;font-weight:700;padding:6px 0}.plei{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.plei.off .plen{opacity:.45}.plei input[type=checkbox]{width:20px;height:20px;flex:none;margin:0}.plen{flex:1;min-width:0;display:grid}.plen b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.plen small{color:var(--mute);font-size:12px}.plein{width:92px;flex:none;text-align:left}
.lossb{margin-top:12px;border:1px solid rgba(255,111,97,.4);background:var(--badsoft);border-radius:16px;padding:12px 14px;color:var(--ink);display:grid;gap:6px}.lossb>b{color:var(--bad)}.lossl{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13.5px;border-top:1px dashed rgba(255,111,97,.3);padding-top:6px}.lossl b{color:var(--bad)}
.tgq{display:grid;gap:8px;border:1px solid rgba(36,211,191,.35);background:var(--accsoft);border-radius:16px;padding:12px}.tgq>b{font-size:15px}.tgq small{color:var(--mute);font-size:12.5px;line-height:1.5}.tgq a.btn{text-align:center;text-decoration:none}
.pstep{display:flex;align-items:center;gap:12px;margin:2px 0}.pstep button{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);font-size:26px;font-weight:600;line-height:1;cursor:pointer;display:grid;place-items:center}.pstep button:active{background:var(--accsoft);color:var(--acc)}.pstep b{min-width:64px;text-align:center}
.chipw{display:flex;flex-direction:column;gap:4px;max-width:100%}.chipw .chip{width:100%}.cstep{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--accsoft);border:1px solid rgba(36,211,191,.45);border-radius:12px;padding:3px}.cstep button{width:40px;height:34px;border:0;border-radius:9px;background:var(--panel);color:var(--ink);font-size:22px;font-weight:700;line-height:1;cursor:pointer;display:grid;place-items:center}.cstep button:active{background:var(--acc);color:var(--accink)}.cstep b{flex:1;text-align:center;font-size:16px;font-variant-numeric:tabular-nums}
.stkc table{width:100%;min-width:0;table-layout:fixed;font-size:13.5px}.stkc.wrap{overflow-x:visible}.stkc th:nth-child(1),.stkc td:nth-child(1){width:44%;overflow-wrap:anywhere}.stkc th:nth-child(2){width:15%}.stkc th:nth-child(3){width:16%}.stkc th:nth-child(4){width:25%}.stkc td,.stkc th{padding:7px 5px}.stkc td.r,.stkc th.r{white-space:nowrap}.stkc tr.sgrp td{text-align:start}.stkc .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.stkc .stat{padding:8px 8px}.stkc .stat small{font-size:11px;line-height:1.3}.stkc .stat b{font-size:clamp(14px,4.2vw,19px)}.stkc tr.sgrp td{background:var(--panel2);color:var(--mute);font-size:12.5px;font-weight:700}.stkc tr.stot td{font-weight:800;border-top:2px solid var(--line)}.stkc td b{font-variant-numeric:tabular-nums}
#lock{position:fixed;inset:0;z-index:58;display:none;background:radial-gradient(135% 90% at 50% -8%,#3c2817 0%,#26190f 42%,#161010 100%);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 34px) max(16px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-right,0px))}
#lock.on{display:block}body.locked{overflow:hidden}
.lkbox{max-width:380px;margin:0 auto;display:grid;gap:14px;zoom:var(--z,1.15)}
.lkhd{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:6px}.lkhd img{width:60px;height:60px;object-fit:contain;border-radius:16px;background:#fff;padding:6px}.lkhd b{font-size:15px;color:var(--mute);font-weight:600;letter-spacing:.5px}
.lkbrand{display:flex;flex-direction:column;align-items:center;gap:1px}.lkflame{width:46px;height:56px;filter:drop-shadow(0 4px 16px rgba(255,122,24,.5))}.lkword{font-size:42px;font-weight:900;letter-spacing:4px;line-height:1;background:linear-gradient(180deg,#ffe3ab,#ff7a18);-webkit-background-clip:text;background-clip:text;color:transparent}

.mhead{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 10px}
.mhead b{font-size:16px}
.cmove{justify-content:flex-start;gap:10px;padding:10px 14px}
.cmove>svg{flex:none;color:var(--mute)}
.cmove>svg,.okic svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cm-r{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;line-height:1.25}
.cm-r b{font-size:16px!important;font-weight:600!important}
.cm-r small{font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.cmove.ishand{background:#f3f6fa}
.pmseg{display:flex;gap:6px}
.pmseg button{flex:1;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:9px 4px;font-size:14px;cursor:pointer;color:var(--ink)}
.pmseg button.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.pcard{display:grid;gap:8px}
.pcard .pnm{font-size:17px}
.pcard .kv{margin:0;font-size:14px}.pcard .kv dd{text-align:right;font-variant-numeric:tabular-nums;direction:ltr}
.pleft{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:8px}
.pleft span{color:var(--mute);font-size:14px}
.pleft b{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.pcard.boss{border:2px solid var(--acc)}
.pcard.mine{background:#f1faf4}
.cavbtn{position:relative;border:0;background:none;padding:0;cursor:pointer;flex:none;border-radius:50%}
.cavbtn i{position:absolute;bottom:-2px;right:-2px;width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;border:2px solid #fff}
.cavbtn i svg,.btn svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.gi{position:relative;border:0;padding:0;border-radius:10px;overflow:hidden;aspect-ratio:1;max-width:100%;background:var(--panel2);cursor:pointer}
.gi img{width:100%;height:100%;object-fit:cover;display:block}
.gi span{position:absolute;inset:auto 0 0 0;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:11px;padding:10px 6px 4px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ncgal{grid-column:1/-1}.ncgal .gal{margin-top:6px}.gi .gx{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;cursor:pointer;display:grid;place-items:center;padding:0}.gadd{display:flex!important;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1.5px dashed var(--line)!important;background:transparent!important;color:var(--acc);font-size:12px;text-align:center}.gadd span{position:static!important;background:none!important;color:var(--acc)!important;padding:0!important;font-size:12px!important;white-space:normal!important;text-align:center!important}.gadd svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ncph{grid-column:1/-1;display:flex;align-items:center;gap:14px}.ncph label.cavbtn{display:block}.ncph b{font-size:15px;font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 18px;border-radius:999px;z-index:70;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

/* ================= Koyu tema · Firuze (dark theme layer) ================= */
:root{--bg:#0e1316;--g1:#12191c;--g2:#0e1316;--panel:#182125;--panel2:#202b30;--panel3:#283439;--ink:#e9eff1;--mute:#8e9ca3;--line:#2a363c;--acc:#1fc7b6;--acc2:#16a596;--accsoft:rgba(31,199,182,.14);--accink:#04211e;--bad:#ff6f61;--badsoft:rgba(255,111,97,.13);--ok:#45d99a;--oksoft:rgba(69,217,154,.13);--warn:#f4b955;--warnsoft:rgba(244,185,85,.13);--info:#6cb4ff;--infosoft:rgba(108,180,255,.13);--dark:#0a0f11;color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:"Noto Sans Arabic","Noto Sans","UKIJ Tuz Tom",Tahoma,sans-serif}
::selection{background:var(--accsoft)}
/* header */
.bar{background:rgba(14,19,22,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.tb{color:var(--ink)}
.pill{background:var(--panel2);color:var(--ink)}
.pill svg{color:var(--acc)}
.pill small{color:var(--mute)}
#msg{background:var(--warnsoft);color:var(--warn)}
/* menu */
#dwbg{background:rgba(0,0,0,.55)}
.dw{background:var(--panel);border-inline-start:1px solid var(--line)}
.dw button{color:var(--ink)}
.dw button.on{background:var(--accsoft);color:var(--acc)}
.dw svg{color:var(--acc)}
/* home */
.home3{background:radial-gradient(120% 70% at 85% 0%,rgba(31,199,182,.16),transparent 60%),linear-gradient(180deg,var(--g1),var(--bg));padding:16px 14px 34px}
.sell{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--accink);box-shadow:0 10px 28px rgba(31,199,182,.28);border-radius:20px}
.quick button{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.quick button:active{background:var(--panel2)}
.quick button svg{color:var(--acc)}
.quick .dot{background:var(--bad);color:#fff}
.today{background:var(--panel);border:1px solid var(--line)}
.today small{color:var(--mute)}
.alert{background:var(--badsoft);color:#ffb3aa;border:1px solid rgba(255,111,97,.25)}
.alert.ok{background:var(--oksoft);color:#9cefc8;border-color:rgba(69,217,154,.25)}
.alert.info{background:var(--infosoft);color:#b8dbff;border-color:rgba(108,180,255,.25)}
.alert b{color:inherit}
.sheetl{background:var(--panel);border-top:1px solid var(--line)}
.list:before{background:var(--line)}
.sec{background:var(--panel2);color:var(--mute);border-bottom:1px solid var(--line)}
.sec span:last-child{color:var(--mute)}
.li:active{background:var(--panel2)}
.li small,.li small.when{color:var(--mute)}
.li.more{color:var(--acc)}
/* islem / timeline */
.home{background:linear-gradient(180deg,var(--g1),var(--bg))}
.rail button{color:var(--acc)}
.rail button.on{background:var(--accsoft)}
.mini{background:var(--panel);border:1px solid var(--line)}
.cal button{background:var(--panel);color:var(--ink)}
.cal button.t{outline-color:var(--acc)}
.vtitle{color:var(--mute)}
.sumbar{background:var(--dark);border-bottom:1px solid var(--line)}
.sumbar:before{background:var(--line)}
.mnav button{color:var(--mute)}
.day{background:var(--panel2)}
.day span:first-child{color:var(--mute)}
.day span:last-child{color:var(--acc)}
.ev .i{background:var(--panel2);color:var(--ink)}
.ev .t div{color:var(--acc)}
.srch{border-color:var(--line)}
/* pages */
.pg h2{color:var(--ink)}
.card{background:var(--panel);border:1px solid var(--line);box-shadow:none}
.stat{background:var(--panel);border:1px solid var(--line)}

.hero{background:linear-gradient(135deg,#123b38,#0f2523);border-color:rgba(31,199,182,.3)}
.hero small{color:#9fd9d2}

label{color:var(--mute)}
input,select,textarea{background:var(--panel2);border-color:var(--line);color:var(--ink)}
input::placeholder,textarea::placeholder{color:#62717a}

select option{background:var(--panel);color:var(--ink)}
.btn{background:var(--acc);color:var(--accink)}

.paybar{background:rgba(10,15,17,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.4)}

/* modals */

a.wa{color:#8ff0c4!important;border-color:rgba(69,217,154,.35)!important;background:var(--oksoft)!important}
/* badges */
.st0{background:var(--warnsoft);color:var(--warn)}.st1{background:var(--infosoft);color:var(--info)}.st2{background:var(--oksoft);color:var(--ok)}.st3{background:var(--panel3);color:var(--mute)}.st4{background:var(--badsoft);color:var(--bad)}

.ptop input{background:var(--panel2)}

  --brand1:#e5483d;--brand2:#f5973a;--brandg:linear-gradient(90deg,#e5483d 0%,#e5483d 64%,#f5973a 64%,#f5973a 100%);
  --r:18px;--sh:0 1px 0 rgba(255,255,255,.035) inset,0 10px 28px -12px rgba(0,0,0,.55)}
html,body{background:var(--bg)}
body{background:radial-gradient(90% 40% at 100% 0%,rgba(36,211,191,.07),transparent 70%),var(--bg);background-attachment:fixed}
/* başlık çubuğu + marka şeridi */
.bar{background:rgba(10,15,19,.82);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border-bottom:0}
.bar::after{content:"";position:absolute;right:0;left:0;bottom:0;height:2px;background:var(--brandg);opacity:.9}
.pill{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.08);box-shadow:0 6px 18px -10px rgba(0,0,0,.6)}
.pill b{letter-spacing:.01em}
#msg{margin:10px 12px 0;border-radius:12px;font-size:12.5px;line-height:1.5;border:1px solid rgba(244,185,85,.22)}
/* sayfa başlıkları */
.pg>h2{position:relative;padding-bottom:10px}
.pg>h2::after{content:"";position:absolute;inset-inline-start:0;bottom:0;width:44px;height:3px;border-radius:2px;background:var(--brandg)}
/* kartlar ve listeler */
.card,.lst,.today,.todo,.ratebox,.stat,.mini,.quick button,.instbox,.custbar{border-radius:var(--r);border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,0) 60%),var(--panel);box-shadow:var(--sh)}
.lst .li,.lst>.li{border-color:var(--line)}
.li{transition:background .15s}
.li:active,.td:active{background:rgba(255,255,255,.04)}
.sec{background:transparent;letter-spacing:.03em}
/* ana sayfa */
.home3{background:radial-gradient(110% 60% at 90% -10%,rgba(36,211,191,.18),transparent 60%),radial-gradient(80% 40% at 0% 0%,rgba(229,72,61,.07),transparent 70%),linear-gradient(180deg,var(--g1),var(--bg));gap:14px}
.sell{position:relative;overflow:hidden;border-radius:22px;padding:22px;font-size:23px;letter-spacing:.01em;background:linear-gradient(135deg,#2be0cb 0%,#18b7a4 55%,#0f9a89 100%);color:var(--accink);box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 16px 34px -14px rgba(36,211,191,.65)}
.sell::before{content:"";position:absolute;inset:0 0 50% 0;background:linear-gradient(180deg,rgba(255,255,255,.22),transparent);pointer-events:none}
.sell:active{transform:translateY(1px);filter:brightness(.97)}
.quick button{padding:14px 6px;gap:8px;font-weight:600}
.quick button svg{width:22px;height:22px;padding:9px;box-sizing:content-box;border-radius:14px;background:var(--accsoft);color:var(--acc)}
.quick button:active{transform:scale(.98)}
.today b,.stat b,.mini b,.total b,.cash2 b{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.today b{font-size:clamp(24px,7vw,32px);font-weight:700}
.ratechip b{color:var(--acc)}
.mbline{background:rgba(255,255,255,.02)}
.tdh span{background:var(--accsoft);color:var(--acc)}
/* tuşlar ve form */
.btn{border-radius:14px;background:linear-gradient(135deg,#2be0cb,#14ad9b);color:var(--accink);box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 8px 20px -12px rgba(36,211,191,.7)}
.btn.g{background:rgba(255,255,255,.045);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:linear-gradient(135deg,#ff7a6d,#e5483d);color:#2a0905;box-shadow:none}
.btn:active{transform:translateY(1px)}
input,select,textarea{border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(36,211,191,.16);outline:none}
.seg{border-radius:12px;padding:3px}.seg button{border-radius:10px}
.seg button.on{background:var(--accsoft);color:var(--acc)}
.pmseg button{border-radius:12px}
.pmseg button.on{background:linear-gradient(135deg,#2be0cb,#14ad9b);border-color:transparent}
/* çipler, ürünler */
.cchips button{border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--line);padding:7px 15px}
.cchips button.on,.cchips.sm button.on{background:linear-gradient(135deg,#2be0cb,#14ad9b);border-color:transparent;box-shadow:0 6px 16px -10px rgba(36,211,191,.8)}
.pav{position:relative;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 6px 14px -8px rgba(0,0,0,.7)}
.pav::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(160deg,rgba(255,255,255,.22),transparent 55%);pointer-events:none}
.pst{border-radius:12px;background:rgba(255,255,255,.045)}
.pst.lowb{background:var(--badsoft);box-shadow:inset 0 0 0 1px rgba(255,111,97,.3)}
.pplus{border-radius:14px;border-color:rgba(36,211,191,.25)}
.chip{border-radius:16px;background:rgba(255,255,255,.035)}
.chip.inc{background:linear-gradient(160deg,rgba(36,211,191,.16),rgba(36,211,191,.05));border-color:rgba(36,211,191,.6)}
.cbadge{box-shadow:0 0 0 3px var(--bg)}
.plbtn{border-style:dashed}
/* ödeme çubuğu ve alt menü */
.paybar{background:rgba(10,15,19,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tabbar{right:10px;left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);border-radius:22px;border:1px solid rgba(255,255,255,.08);background:rgba(16,23,28,.82);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);box-shadow:0 18px 40px -16px rgba(0,0,0,.8);padding:6px 4px}
.tabbar button{gap:3px;padding:4px 0;letter-spacing:0;text-transform:none;font-size:11px}
.tabbar button svg{box-sizing:content-box;padding:5px 16px;border-radius:999px;transition:background .2s}
.tabbar button.on svg{background:var(--accsoft);filter:none}
.tabbar button.on{font-weight:700}
/* pencereler */
#modal,#dlg{background:rgba(3,6,8,.66);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#dlgbox{border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.035),transparent 40%),var(--panel)}
.sheet{border-radius:22px}
.okbar{border-radius:16px}
.dw{background:linear-gradient(180deg,rgba(255,255,255,.03),transparent 30%),var(--panel)}
.dw button{border-radius:12px}
#toast{border-radius:14px;box-shadow:0 12px 30px -12px rgba(0,0,0,.7)}
/* durum renkleri biraz daha canlı */
.alert{border-radius:16px}
.debtc{border-color:rgba(255,111,97,.55)}
/* ============ GELONE modern 2.0 · yalnızca görünüş ============ */
:root{
  --r-card:20px;--r-btn:15px;
  --sheen:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,0) 42%);
  --edge:0 0 0 1px rgba(255,255,255,.05);
  --lift:0 2px 6px -3px rgba(0,0,0,.55),0 12px 30px -16px rgba(0,0,0,.72);
  --accrgb:36,211,191;
  --accgrad:linear-gradient(135deg,#34e3cf 0%,#20c4b2 48%,#10a593 100%);
}
*{-webkit-tap-highlight-color:transparent}

/* ---- kartlar: ince kenar + yumuşak derinlik + üstten parıltı ---- */
.card{
  border-radius:var(--r-card);
  border:1px solid rgba(255,255,255,.07);
  background:
    var(--sheen),
    linear-gradient(180deg,rgba(255,255,255,.012),rgba(255,255,255,0)),
    var(--panel);
  box-shadow:var(--lift);
}
.card.bo{border-color:rgba(255,255,255,.08)}

/* ---- düğmeler: modern, cam gibi, net basılış ---- */
.btn{
  border-radius:var(--r-btn);
  background:var(--accgrad);
  color:var(--accink);
  font-weight:650;
  letter-spacing:.005em;
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 1px 1px rgba(255,255,255,.14) inset,0 10px 22px -12px rgba(var(--accrgb),.75),0 2px 6px -3px rgba(0,0,0,.5);
  transition:transform .11s ease,box-shadow .18s ease,filter .18s ease;
}
.btn:active{
  transform:translateY(1px);
  filter:saturate(1.05);
  box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 4px 12px -8px rgba(var(--accrgb),.7);
}
.btn.g{
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));
  color:var(--ink);
  border:1px solid rgba(255,255,255,.11);
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 6px 16px -12px rgba(0,0,0,.7);
}
.btn.g:active{transform:translateY(1px);background:rgba(255,255,255,.055)}
.btn.danger{
  background:linear-gradient(135deg,#ff7a6d,#e8463a);
  color:#2a0806;
  box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 10px 22px -12px rgba(229,72,58,.7);
}
.btn.s{border-radius:12px}
.linkb{transition:color .15s ease}

/* ---- ana sat düğmesi: daha derin, ışık süzülmesi ---- */
.sell{
  border-radius:15px;
  padding:11px 18px;font-size:15.5px;
  background:var(--accgrad);
  box-shadow:0 1px 0 rgba(255,255,255,.28) inset,0 6px 14px -12px rgba(var(--accrgb),.45),0 2px 6px -4px rgba(0,0,0,.4);
  transition:transform .12s ease,box-shadow .2s ease;
}
.sell svg{width:18px;height:18px}
.sell::after{display:none}
.sell:active{transform:translateY(1px) scale(.995);box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 10px 24px -14px rgba(var(--accrgb),.7)}

/* ---- hızlı düğmeler: derinlik + ikon rozeti ---- */
.quick button{
  border-radius:18px;
  border:1px solid rgba(255,255,255,.07);
  background:var(--sheen),var(--panel);
  box-shadow:0 6px 16px -12px rgba(0,0,0,.7);
  transition:transform .11s ease,background .18s ease;
}
.quick button:active{transform:translateY(1px);background:var(--panel2)}
.quick button svg{color:var(--acc);filter:drop-shadow(0 2px 6px rgba(var(--accrgb),.35))}

/* ---- segmentli seçici: modern hap ---- */
.seg{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:4px;gap:2px}
.seg button{border-radius:12px;transition:background .18s ease,color .18s ease;font-weight:600}
.seg button.on{
  background:linear-gradient(180deg,rgba(var(--accrgb),.2),rgba(var(--accrgb),.1));
  color:var(--acc);
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 4px 12px -8px rgba(var(--accrgb),.5);
}

/* ---- girişler: yumuşak hatlar + odak halkası ---- */
input,select,textarea{border-radius:13px;transition:border-color .15s ease,box-shadow .15s ease,background .15s ease}
input:focus,select:focus,textarea:focus{
  border-color:var(--acc)!important;
  box-shadow:0 0 0 3px rgba(var(--accrgb),.16);
  outline:none;
}

/* ---- alt menü: aktif sekme hap arka planı ---- */
.tabbar{border:1px solid rgba(255,255,255,.09);box-shadow:0 18px 44px -18px rgba(0,0,0,.85),0 2px 8px -4px rgba(0,0,0,.5)}
.tabbar button{position:relative;transition:color .18s ease;border-radius:14px;padding:6px 0}
.tabbar button.on{color:var(--acc)}
.tabbar button.on::before{
  content:"";position:absolute;inset:2px 10px;border-radius:12px;z-index:-1;
  background:radial-gradient(120% 120% at 50% 0%,rgba(var(--accrgb),.18),rgba(var(--accrgb),.05) 70%);
}
.tabbar button.on svg{filter:drop-shadow(0 0 8px rgba(var(--accrgb),.5))}

/* ---- başlıklar: daha keskin hiyerarşi ---- */
.pg>h2{letter-spacing:-.02em;font-weight:750}
.card h2{letter-spacing:-.01em}

/* ---- üst çubuk: cam dokusu ---- */
.bar{border-bottom:1px solid rgba(255,255,255,.05)}
.pill{transition:transform .12s ease}.pill:active{transform:scale(.97)}
.uchip{transition:background .15s ease}.uchip:active{background:rgba(255,255,255,.1)}
</style>

</style>

/* ---- Renkli tasarım: her bölümün kendi rengi, Türkçe için Nunito ---- */
:root{--c-satis:#FF8A3D;--c-satis-ink:#2A1400;--c-stok:#FFD23F;--c-stok-ink:#2A2100;--c-musteri:#4CD69A;--c-musteri-ink:#0F2A1E;--c-kasa:#6D3FE0;--c-rapor:#FF5C8A;--c-rapor-ink:#2B0612;--c-ana:#3D5AFE}
body{font-family:"Nunito","Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.home3 .sell{background:linear-gradient(135deg,#FFA45E 0%,var(--c-satis) 60%,#F2711C 100%);color:var(--c-satis-ink);font-weight:900;border-radius:24px;box-shadow:0 8px 24px rgba(255,138,61,.28)}
.home3 .quick button{border:0!important;border-radius:22px;font-weight:800}
.home3 .quick button:nth-child(1){background:var(--c-musteri);color:var(--c-musteri-ink)}
.home3 .quick button:nth-child(2){background:var(--c-stok);color:var(--c-stok-ink)}
.home3 .quick button:nth-child(3){background:var(--c-rapor);color:var(--c-rapor-ink)}
.home3 .quick button svg{color:inherit!important;stroke:currentColor}
.home3 .quick button:nth-child(n) > *:first-child{background:rgba(255,255,255,.35)!important;color:inherit!important}
.tabbar button.on{font-weight:800}
.tabbar button:nth-child(1).on{color:var(--c-ana)!important}
.tabbar button:nth-child(2).on{color:var(--c-satis)!important}
.tabbar button:nth-child(3).on{color:#E0A800!important}
.tabbar button:nth-child(4).on{color:#1FAE70!important}
body[data-tab] .pg>h2{font-weight:900}
body[data-tab="kasa"] .pg>h2 + *::before,body[data-tab="kasa"] .bar::after{background:var(--c-satis)!important}
body[data-tab="urun"] .bar::after,body[data-tab="alis"] .bar::after{background:var(--c-stok)!important}
body[data-tab="musteri"] .bar::after{background:var(--c-musteri)!important}
body[data-tab="sandoq"] .bar::after,body[data-tab="hesap"] .bar::after{background:var(--c-kasa)!important}
body[data-tab="rapor"] .bar::after,body[data-tab="gider"] .bar::after{background:var(--c-rapor)!important}
body[data-tab="panel"] .bar::after{background:var(--c-ana)!important}
body[data-tab] .bar::after{height:4px!important;opacity:1!important}

/* ---- Satış: ürün seçme kartları ---- */
.spk-top{display:flex;gap:8px;align-items:center}
.spk-top input{flex:1;min-width:0;margin:0}
.spk-h{flex:1;font-weight:800;font-size:16px}
.spk-scan{flex:none;width:48px;height:48px;border-radius:14px;border:0;background:var(--c-satis,#FF8A3D);color:var(--c-satis-ink,#2A1400);display:grid;place-items:center;cursor:pointer}
.spk #cam:not(:empty){margin-top:10px}
.spk #cam video{width:100%;border-radius:14px;max-height:240px;object-fit:cover;background:#000}
.spk-cats{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 2px;scrollbar-width:none}
.spk-cats::-webkit-scrollbar{display:none}
.spk-cats button{flex:none;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.spk-cats button small{opacity:.6;font-weight:600;margin-left:2px}
.spk-cats button.on{background:var(--c-satis,#FF8A3D);border-color:transparent;color:var(--c-satis-ink,#2A1400)}
.spk-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
@media (min-width:620px){.spk-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}}
.spk-c{position:relative;display:flex;flex-direction:column;border-radius:14px;background:var(--panel2);border:2px solid transparent;overflow:hidden;min-width:0}
.spk-c.inc{border-color:var(--c-satis,#FF8A3D)}
.spk-c.out{opacity:.5}
.spk-tap{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:0 0 8px;min-width:0}
.spk-tap:focus-visible{outline:3px solid var(--acc);outline-offset:-3px;border-radius:16px}
.spk-img{position:relative;display:block;aspect-ratio:5/4;background:var(--panel);margin-bottom:4px}
.spk-img img{width:100%;height:100%;object-fit:cover;display:block}
.spk-ini{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:20px;font-weight:900;text-transform:uppercase}
.spk-q{position:absolute;top:5px;left:5px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--c-satis,#FF8A3D);color:var(--c-satis-ink,#2A1400);font-style:normal;font-weight:900;font-size:13px;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.spk-st{position:absolute;bottom:4px;right:4px;font-style:normal;font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:999px;background:rgba(15,20,25,.72);color:#fff;font-variant-numeric:tabular-nums}
.spk-st.low{background:#FFD23F;color:#2A2100}
.spk-st.out{background:#FF5C8A;color:#2B0612}
.spk-n{padding:0 7px;font-weight:800;font-size:12.5px;line-height:1.25;overflow-wrap:anywhere}
.spk-sp{padding:0 7px;color:var(--mute);font-size:10.5px;line-height:1.3;overflow-wrap:anywhere}
.spk-p{padding:1px 7px 0;font-size:14px;font-weight:900;font-variant-numeric:tabular-nums}
.spk-step{display:flex;align-items:center;justify-content:space-between;gap:2px;padding:0 5px 6px}
.spk-step button{width:32px;height:32px;border:0;border-radius:10px;background:var(--panel);color:var(--ink);font-size:19px;font-weight:800;cursor:pointer;display:grid;place-items:center}
.spk-step button:last-child{background:var(--c-satis,#FF8A3D);color:var(--c-satis-ink,#2A1400)}
.spk-step b{flex:1;text-align:center;font-size:14px;font-variant-numeric:tabular-nums}
</style>

(function(){

  function tx(mode,fn){return idb().then(function(db){return new Promise(function(res,rej){var t=db.transaction("f",mode),st=t.objectStore("f"),out=fn(st);t.oncomplete=function(){res(out&&out.result!==undefined?out.result:out)};t.onerror=function(){rej(t.error)}})})}
  function b2d(b){return new Promise(function(res){var r=new FileReader();r.onload=function(){res(r.result)};r.readAsDataURL(b)})}
  function d2b(d){var p=d.split(","),m=(p[0].match(/:(.*?);/)||[])[1]||"image/jpeg",s=atob(p[1]),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return new Blob([a],{type:m})}
  var assets={
    upload:function(blob){var id="f"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);

  };

  }
})();

/* ---------- hesaplar ---------- */
function avgMap(){const m={};S.products.forEach(p=>{const b=S.buys.filter(x=>x.pid===p.id),o=Math.max(0,num(p.open)),oc=num(p.cost);const q=b.reduce((a,x)=>a+x.qty,0)+(oc?o:0),c=b.reduce((a,x)=>a+x.qty*x.cost,0)+(oc?o*oc:0);m[p.id]=q?c/q:oc});return m}
/* Satış anındaki maliyet (sonradan alınan mal eski ayın kârını değiştirmez) */
const lc=(x,avg)=>x.cost!=null?num(x.cost):(avg[x.pid]||0);
function calc(){
  const avg=avgMap();
  return S.products.map(p=>{
    const bq=S.buys.filter(x=>x.pid===p.id).reduce((a,x)=>a+x.qty,0);
    const s=S.sales.filter(x=>x.pid===p.id);
    const sq=s.reduce((a,x)=>a+x.qty,0),sr=s.reduce((a,x)=>a+x.qty*x.price,0);
    const stock=num(p.open)+bq-sq;
    return {p,stock,bq,sq,avg:avg[p.id],sr,profit:sr-s.reduce((a,x)=>a+x.qty*lc(x,avg),0),value:stock*avg[p.id]};
  });
}
function stats(pred){
  const avg=avgMap();
  const L=S.sales.filter(x=>pred(x.date));
  const gross=L.reduce((a,x)=>a+x.qty*x.price,0);
  const R=S.receipts.filter(x=>pred(x.date));
  const disc=R.reduce((a,x)=>a+num(x.disc),0);
  const ciro=gross-disc;
  const cost=L.reduce((a,x)=>a+x.qty*lc(x,avg),0);
  const gider=S.expenses.filter(x=>pred(x.date)).reduce((a,x)=>a+x.amount,0);
  const fis=R.length+L.filter(x=>!x.rid&&x.qty>0).length;
  const svc=S.services.filter(x=>x.st>=3&&pred(x.done)).reduce((a,x)=>a+num(x.fee),0);
  const qty=L.reduce((a,x)=>a+x.qty,0);
  const byP={};L.forEach(x=>{byP[x.pid]=byP[x.pid]||{q:0,r:0,k:0};byP[x.pid].q+=x.qty;byP[x.pid].r+=x.qty*x.price;byP[x.pid].k+=x.qty*(x.price-lc(x,avg))});
  const top=Object.entries(byP).map(([pid,v])=>({pid,...v})).sort((a,b)=>b.r-a.r);
  return {ciro:ciro+svc,cost,kar:ciro+svc-cost,gider,net:ciro+svc-cost-gider,fis,qty,top,disc,svc};
}
function cust(){
  return S.customers.map(c=>{
    const L=S.sales.filter(x=>x.cid===c.id),R=S.receipts.filter(x=>x.cid===c.id);
    const SV=S.services.filter(x=>x.cid===c.id&&x.st>=3);
    const tot=L.reduce((a,x)=>a+x.qty*x.price,0)-R.reduce((a,x)=>a+num(x.disc),0)+SV.reduce((a,x)=>a+num(x.fee),0);
    const paid=L.filter(x=>!x.rid).reduce((a,x)=>a+(x.paid==null?x.qty*x.price:x.paid),0)+R.reduce((a,x)=>a+num(x.paid),0)+S.payments.filter(x=>x.cid===c.id).reduce((a,x)=>a+x.amount,0)+SV.reduce((a,x)=>a+num(x.paid),0);
    return {c,tot,debt:r2(tot-paid)};
  });
}

/* Üç yönlü birleştirme: diğer telefondaki değişiklikler kaybolmaz */
function merge3(B,L,R){
  B=B||{};const out={};
  for(const k of new Set([...Object.keys(L),...Object.keys(R)])){
    const b=B[k],l=L[k],r=R[k],key=x=>x&&(x.id||x.tid);
    if(Array.isArray(l)&&Array.isArray(r)&&l.concat(r).every(key)){
      const bm=new Map((Array.isArray(b)?b:[]).map(x=>[key(x),x])),lm=new Map(l.map(x=>[key(x),x])),rm=new Map(r.map(x=>[key(x),x])),seen=new Set(),res=[];
      for(const x of [...r,...l]){const id=key(x);if(seen.has(id))continue;seen.add(id);
        const bx=bm.get(id),lx=lm.get(id),rx=rm.get(id);
        if(bx){if(lx&&rx)res.push(jeq(lx,bx)?rx:lx)}else res.push(lx||rx)}
      out[k]=res;
    }else out[k]=jeq(l,b)?r:l;
  }
  for(const [ak,sk] of [["receipts","seq"],["services","sseq"],["payments","pseq"]]){
    const arr=out[ak]||[],rIds=new Set((R[ak]||[]).map(x=>x.id)),bIds=new Set((B[ak]||[]).map(x=>x.id));
    let s=Math.max(num(L[sk]),num(R[sk]),...arr.map(x=>num(x.no)),0);
    const used=new Set(arr.filter(x=>rIds.has(x.id)).map(x=>x.no));
    arr.forEach(x=>{if(!rIds.has(x.id)&&!bIds.has(x.id)&&used.has(x.no))x.no=++s;used.add(x.no)});
    out[sk]=s;
  }
  return out;
}
async function readRemote(m){

    if(m.h&&parts.some((p,i)=>hsh(p)!==m.h[i]))continue;
    try{return {d:JSON.parse(parts.join("")),parts,t:m.t||0}}catch(e){if(!m.h)break}
  }
  throw new Error("remote");
}

async function saveRemote(){
  if(!docRef)return;
  if(saving){dirty=true;return}
  saving=true;dirty=false;
  try{
    const pullIn=async()=>{const ms=await docRef.get(),m=ms.exists?ms.data():null;if(m&&(m.t||0)!==remoteT){const R=await readRemote(m);if(R)mergeIn(R)}return m};
    let m=await pullIn();
    const changed=()=>!base||!m||JSON.stringify(S)!==JSON.stringify(base);
    if(changed()){
      const lock=col.doc("state-ug-lock");
      for(let i=0;i<30;i++){let ok=true;try{ok=(await lock.acquire({holder:DEV,ttlMs:3000})).acquired}catch(e){}if(ok)break;await sleep(400)}
      m=await pullIn();
    }
    const js=JSON.stringify(S);
    if(changed()){
      const parts=[];for(let i=0;i<js.length;i+=CH)parts.push(js.slice(i,i+CH));
      for(let i=0;i<parts.length;i++)if(parts[i]!==lastParts[i])await col.doc("state-ug-p"+i).set({s:parts[i]});
      const t=Math.max(Date.now(),remoteT+1);
      await docRef.set({fmt:2,n:parts.length,t,h:parts.map(hsh),by:DEV});
      for(let i=parts.length;i<lastParts.length;i++){try{await col.doc("state-ug-p"+i).delete()}catch(e){}}
      lastParts=parts;keepBase(js,t);
    }
    if($("#msg").dataset.err){$("#msg").textContent="";delete $("#msg").dataset.err}
  }catch(e){$("#msg").textContent="Buluta kaydedilemedi. İnternet bağlantınızı kontrol edin; veriler telefonda saklandı.";$("#msg").dataset.err=1}
  saving=false;if(dirty)saveRemote();
}

function chart(data,h=190){

  let s=`<svg viewBox="0 0 ${W} ${h}" style="min-width:${Math.round(W*0.8)}px" role="img" aria-label="Satış ve kâr grafiği">`;
  [mx,mx/2,0].forEach(v=>{s+=`<line x1="${pad}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#2a363c"/><text x="${pad-6}" y="${y(v)+4}" fill="#8e9ca3" font-size="10" text-anchor="end">${shortN(v)}</text>`});
  data.forEach((d,i)=>{

    if(i%step===0)s+=`<text x="${x+bw/2}" y="${h-6}" fill="#8e9ca3" font-size="10" text-anchor="middle">${esc(d.l)}</text>`;
  });
  return `<div class="chart wrap">${s}</svg></div><div class="legend"><span><i style="background:#1fc7b6"></i>Satış tutarı</span><span><i style="background:#2f6f8f"></i>Toplam kâr</span></div>`;
}

  const f=inp.files&&inp.files[0];if(!f)return;const fr=new FileReader();
  fr.onload=()=>{const im=new Image();im.onload=()=>{const m=900,sc=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
    S.plCov[key]=c.toDataURL("image/jpeg",.8);go();plOpen();toast("Resim eklendi")};im.src=fr.result};fr.readAsDataURL(f)}

async function checkout(){

  let paid=r2(pU+(rate?pS/rate:0)),change=0;

    let chU=change;const chFromS=Math.min(pS,rate?chU*rate:0);pS=r2(pS-chFromS);chU=r2(chU-(rate?chFromS/rate:0));pU=r2(pU-chU);

  const r={id:uid(),no:jr?0:S.seq,date:today(),time:nowT(),cid:cartCid,disc,total:tot,paid:r2(paid),paidU:r2(pU),paidS:r2(pS),rate:(pS?rate:0),change,pm:cartPm,by:WHO()};if(jr){r.par=jr.id;r.ts=Date.now()}

const rRoot=r=>(r&&r.par&&S.receipts.find(x=>x.id===r.par))||r;
const rDT=x=>x.date+(x.time||"");
function rFam(R){return [R,...S.receipts.filter(x=>x.par===R.id).sort((a,b)=>rDT(a).localeCompare(rDT(b)))]}
function rChain(R){const ids=new Set(rFam(R).map(x=>x.id));
  const key=x=>rDT(x)+(x.ts?"T"+String(x.ts).padStart(15,"0"):"0"+String(num(x.no)).padStart(8,"0"));
  return [...S.payments.filter(p=>(p.alloc||[]).some(a=>ids.has(a.rid))),...rFam(R).slice(1)].map(x=>[x,key(x)]).sort((a,b)=>a[1]<b[1]?-1:a[1]>b[1]?1:0).map(x=>x[0])}
const rNo=r=>{if(r&&r.par){const R=S.receipts.find(x=>x.id===r.par);if(R)return rNo(R)+"/"+(rChain(R).indexOf(r)+2)}return "S-"+String(num(r.no)).padStart(4,"0")};
const famBal=R=>r2(rFam(R).reduce((a,m)=>a+rBal(m),0));
const sgOK=R=>!!(R&&R.sign&&R.sign.img&&(num(R.sign.n)||1)>=rFam(R).length);
function joinOpts(cid){const m={};openR(cid).forEach(r=>{const R=rRoot(r);m[R.id]=R});return Object.values(m).sort((a,b)=>rDT(b).localeCompare(rDT(a)))}

const pNo=p=>"T-"+String(num(p.no)).padStart(4,"0");
/* Veresiye fiş zinciri: her tahsilat asıl satış fişine bağlanır (S-0001/2, S-0001/3 …) */
function rPays(rid){return S.payments.filter(p=>(p.alloc||[]).some(a=>a.rid===rid)).sort((a,b)=>(a.date+(a.time||"")+String(num(a.no)).padStart(8,"0")).localeCompare(b.date+(b.time||"")+String(num(b.no)).padStart(8,"0")))}
function rBal(r){
  const ret=S.sales.filter(x=>x.ret===r.id).reduce((a,x)=>a+x.qty*x.price-(x.paid==null?x.qty*x.price:num(x.paid)),0);
  const pd=S.payments.reduce((a,p)=>a+(p.alloc||[]).filter(x=>x.rid===r.id).reduce((b,x)=>b+num(x.a),0),0);
  return r2(num(r.total)-num(r.paid)+ret-pd);
}
function openR(cid){return S.receipts.filter(r=>r.cid===cid&&rBal(r)>0.004).sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||"")))}

/* ---------- Kamera ---------- */
async function camScan(cb){
  const box=$("#cam");
  if(!("BarcodeDetector" in window)){box.innerHTML=`<div class="foot">Bu tarayıcı kamerayla barkod okumayı desteklemiyor. Barkod okuyucu kullanın veya elle yazın.</div>`;return}
  if(stream){stopCam();return}
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    box.innerHTML=`<video id="vid" playsinline muted></video><button class="btn g s" style="margin-top:6px" onclick="stopCam()">Kamerayı kapat</button>`;
    const v=$("#vid");v.srcObject=stream;await v.play();
    const det=new BarcodeDetector();
    const loop=async()=>{if(!stream)return;try{const c=await det.detect(v);if(c.length){const code=c[0].rawValue;stopCam();typeof cb==="function"?cb(code):scanned(code);return}}catch(e){}requestAnimationFrame(loop)};loop();
  }catch(e){stopCam();box.innerHTML=`<div class="foot">Kameraya bağlanılamadı. İzin verdiğinizi kontrol edin veya barkod okuyucu kullanın.</div>`}
}
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}const b=$("#cam");if(b&&$("#vid"))b.innerHTML=""}

function pMarginTxt(){
  const pr=num(pf.price),co=num(pf.cost);
  if(!pr&&!co)return `<span class="foot">Alış fiyatını yazarsanız her birinden ne kadar kâr ettiğiniz görünür.</span>`;
  if(!co)return `<span class="foot">Alış fiyatı yazılmadı.</span>`;
  const k=pr-co;return `Her ${esc(pf.unit||"adet")} başına kâr: <b class="${k<0?"neg":"pos"}">${fmt(k)}</b>${pr?` · <b>%${fmtN(k/pr*100)}</b>`:""}${k<0?` <span class="neg">Zarar!</span>`:""}`;
}

async function pfPhoto(inp){
  const file=inp.files[0];if(!file||!AS)return;pfKeep();pfBusy=true;render();
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)});
    const s=Math.min(1,360/Math.max(img.width,img.height)),cv=document.createElement("canvas");cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",.82));
    const up=await AS.upload(blob,{type:"image/jpeg"});pf.img=up.id;
  }catch(e){note("Resim yüklenemedi. Tekrar deneyin veya renk seçin.")}
  pfBusy=false;render();
}
async function pSave(e){
  e.preventDefault();pfKeep();const v=pf,again=e.submitter&&e.submitter.value==="1",name=(v.name||"").trim(),b=(v.barcode||"").trim();
  if(!name)return;
  if(b&&S.products.some(p=>p.id!==v.id&&!p.arch&&p.barcode===b)){await note("Bu barkod başka bir ürüne ait: "+S.products.find(p=>p.id!==v.id&&!p.arch&&p.barcode===b).name);return}
  if(!v.id&&S.products.some(p=>!p.arch&&p.name.trim()===name)&&!await ask("«"+name+"» adlı ürün zaten var. Yine de yeni ürün ekliyor musunuz?","Ekle"))return;
  const data={name,brand:(v.brand||"").trim(),model:(v.model||"").trim(),kw:num(v.kw)||"",cat:(v.cat||"").trim(),price:num(v.price),cost:num(v.cost),barcode:b,unit:v.unit||"adet",min:num(v.min),war:num(v.war),color:v.color||"",img:v.img||""};
  if(v.id){Object.assign(P(v.id),data);pf=null;pv=v.id;go();toast("Kaydedildi");return}
  const p={id:uid(),...data,open:0};S.products.push(p);
  if(num(v.open)){
    /* Borç hesabı varsa: bu mal Yeşil’den yeni mi geldi? (Evet = borca eklenir) */
    const D=bossDebt(),isNew=data.cost&&D.has&&D.useG&&await ask("«"+name+"» dan "+fmtN(num(v.open))+" "+(data.unit||"adet")+" Yeşil’den yeni mi geldi?\nEvet derseniz "+fmt(num(v.open)*data.cost)+" borca eklenir.\nHayır derseniz önceden var olan mal (açılış stoğu) sayılır.","Evet, yeni geldi");
    if(data.cost)S.buys.push({id:uid(),pid:p.id,qty:num(v.open),cost:data.cost,date:today(),who:isNew?"":OPENW});else p.open=num(v.open)}
  if(again){pf=null;go();pNew();pfKeep();pf.cat=data.cat;pf.unit=data.unit;render();setTimeout(()=>$("#pf_name")?.focus(),60);toast("«"+name+"» Eklendi")}
  else{pf=null;pv=p.id;go();toast("«"+name+"» Eklendi")}
}

    ...S.sales.filter(s=>s.pid===p.id).map(s=>({d:s.date,t:s.qty<0?"İade edildi":"Satıldı"+(cname(s.cid)?" · "+cname(s.cid):""),q:-s.qty}))].sort((a,b)=>b.d.localeCompare(a.d)).slice(0,12);

    <div class="col"><button class="btn" onclick="pIn('${p.id}')">＋ Mal geldi</button><button class="btn s g" onclick="pAdj('${p.id}')">Adedi düzelt</button></div></div>

const OPENW="باشلانغۇچ قالدۇق";
async function stockPick(){
  const L=AP().sort((a,b)=>a.name.localeCompare(b.name,"ug"));
  if(!L.length){setTab("urun");note("Önce ürün ekleyin.");return}
  const st={};calc().forEach(x=>st[x.p.id]=x.stock);
  const f=await form("Hangi ürün geldi?",[{n:"p",l:"Ürün",opts:L.map(p=>[p.id,p.name+(spec(p)?" · "+spec(p):"")+" (Stokta "+fmtN(st[p.id])+")"])}],"Devam");
  if(f&&f.p)pIn(f.p);
}
async function pIn(id){
  const p=P(id),last=[...S.buys].filter(b=>b.pid===id).sort((a,b)=>b.date.localeCompare(a.date))[0];
  const st0=(calc().find(x=>x.p.id===id)||{stock:0}).stock;
  const f=await form("Mal geldi · "+p.name,[{n:"q",l:"Kaç "+unitOf(p)+" geldi? (şu an stokta "+fmtN(st0)+")",num:1,req:1},{n:"u",l:"Tanesini kaça aldınız?",v:last?last.cost:(p.cost||""),num:1,req:1},{n:"w",l:"Kimden aldınız? (isteğe bağlı)",v:last&&last.who!==OPENW?last.who:"",dl:[...new Set(S.buys.map(x=>x.who).filter(w=>w&&w!==OPENW))]}],"Stoğa ekle");
  if(!f||!num(f.q))return;S.buys.push({id:uid(),pid:id,qty:num(f.q),cost:num(f.u),date:today(),who:(f.w||"").trim()});go();toast("Eklendi · Şu an stokta "+fmtN(st0+num(f.q))+" "+unitOf(p));
}
/* − / + ile stoktaki adedi tek tek düzelt (satış veya mal girişi değil, sadece sayım düzeltmesi) */
function pStep(id,d){const p=P(id),x=calc().find(y=>y.p.id===id);if(!p||!x)return;if(x.stock+d<0){toast("Stok 0’dan az olamaz");return}
  p.open=r2(num(p.open)+d);const t=today(),a=(p.adj=p.adj||[]),l=a[a.length-1];if(l&&l.d===t&&l.st)l.q=r2(l.q+d);else a.push({d:t,q:d,st:1});
  go();toast("Kalan: "+fmtN(x.stock+d)+" "+unitOf(p))}
async function pAdj(id){
  const p=P(id),x=calc().find(y=>y.p.id===id);
  const f=await form("Adedi düzelt · "+p.name,[{n:"q",l:"Stokta gerçekte kaç tane var? (şu an "+fmtN(x.stock)+")",v:String(r2(x.stock)),num:1,req:1}],"Düzelt");
  if(!f)return;const d=r2(num(f.q)-x.stock);if(!d)return;p.open=r2(num(p.open)+d);(p.adj=p.adj||[]).push({d:today(),q:d});go();toast("Stok düzeltildi ("+(d>0?"+":"")+fmtN(d)+")");

/* Müşteri raporu: ne aldı (ürün ürün) ve ne ödedi (ödemeler) */
function custData(id){
  const d=S.customers.find(x=>x.id===id);if(!d)return null;
  const isC=s=>{if(s.rid){const r=S.receipts.find(x=>x.id===s.rid);return !!(r&&rRoot(r).cid===id)}return s.cid===id&&!s.rid};
  const items={};
  S.sales.forEach(s=>{if(!isC(s))return;const k=s.pid;(items[k]=items[k]||{qty:0,amt:0});items[k].qty=r2(items[k].qty+num(s.qty));items[k].amt=r2(items[k].amt+num(s.qty)*num(s.price))});
  const svc=S.services.filter(x=>x.cid===id&&x.st>=3&&(num(x.fee)||num(x.paid)));
  const itemRows=Object.entries(items).filter(([k,v])=>Math.abs(v.qty)>0.0001||Math.abs(v.amt)>0.004).sort((a,b)=>b[1].amt-a[1].amt);
  const bought=r2(itemRows.reduce((a,x)=>a+x[1].amt,0)+svc.reduce((a,x)=>a+num(x.fee),0));
  const pays=[...S.payments.filter(x=>x.cid===id).map(p=>({date:p.date,a:num(p.amount),t:"Ödeme yaptı"+(p.no||(p.alloc||[]).length?" · "+payNo(p):"")})),
    ...S.receipts.filter(x=>x.cid===id&&num(x.paid)).map(r=>({date:r.date,a:num(r.paid),t:rNo(r)+" fişinde ödedi"})),
    ...S.sales.filter(x=>isC(x)&&!x.rid&&x.paid!=null&&num(x.paid)>0).map(s=>({date:s.date,a:num(s.paid),t:pname(s.pid)+" için ödedi"})),
    ...svc.filter(x=>num(x.paid)).map(x=>({date:x.done,a:num(x.paid),t:"Tamir #"+x.no+" ödedi"}))].sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));
  const paid=r2(pays.reduce((a,x)=>a+x.a,0)),debt=(cust().find(x=>x.c.id===id)||{}).debt||0;
  return {d,itemRows,svc,bought,pays,paid,debt};
}

async function retR(rid){
  const r0=S.receipts.find(x=>x.id===rid);if(!r0)return;const r=rRoot(r0),fam=rFam(r),multi=fam.length>1;
  const items=[];
  fam.forEach(m=>{const L=S.sales.filter(x=>x.rid===m.id),agg={},sub=L.reduce((a,x)=>a+x.qty*x.price,0),k=sub?m.total/sub:1;
    L.forEach(x=>{agg[x.pid]=agg[x.pid]||{m,k,pid:x.pid,q:0,price:x.price,cost:x.cost};agg[x.pid].q+=x.qty});
    S.sales.filter(x=>x.ret===m.id).forEach(x=>{if(agg[x.pid])agg[x.pid].q+=x.qty});
    Object.values(agg).filter(a=>a.q>0.0001).forEach(a=>items.push(a))});
  if(!items.length){await note("Bu fişteki ürünlerin hepsi iade edilmiş.");return}
  const res=await dlgOpen(`<h3>Ürün iadesi · Fiş ${rNo(r)}</h3><form class="dform" onsubmit="event.preventDefault();dlgClose(Object.fromEntries(new FormData(this)))">${items.map((a,i)=>`<label>${multi?`<small dir="ltr">${rNo(a.m)}</small> `:""}${esc(pname(a.pid))} · En fazla ${fmtN(a.q)}<input name="q_${i}" inputmode="decimal" value="${items.length===1?fmtN(a.q):"0"}"></label>`).join("")}
   ${r.cid?`<label>Parayı nasıl iade edeceksiniz?<select name="how"><option value="cash">Nakit iade</option><option value="debt">Veresiyeden düş</option></select></label>`:""}
   <div class="foot">İade edilen ürün stoğa döner.</div>
   <div class="row dbtn"><button class="btn">İade</button><button type="button" class="btn g" onclick="dlgClose(null)">Vazgeç</button></div></form>`);
  if(!res)return;
  const cash=!r.cid||res.how!=="debt";
  const rows=items.map((a,i)=>({a,q:r2(Math.min(a.q,num(res["q_"+i]))),price:r2(a.price*a.k)})).filter(x=>x.q>0);
  if(!rows.length)return;
  /* Veresiyeden fazla kısım nakit iade edilir (eksi veresiye oluşmaz) */
  let cd=cash?0:(cust().find(x=>x.c.id===r.cid)||{debt:0}).debt,tAll=0,cAll=0;
  fam.forEach(m=>{const R_=rows.filter(x=>x.a.m===m);if(!R_.length)return;
    const tot=r2(R_.reduce((s_,x)=>s_+x.q*x.price,0)),owed=cash?0:Math.max(0,Math.min(rBal(m),cd)),cashPart=cash?tot:r2(Math.max(0,tot-owed));cd=r2(cd-(tot-cashPart));tAll+=tot;cAll+=cashPart;
    R_.forEach(x=>S.sales.push({id:uid(),pid:x.a.pid,qty:-x.q,price:x.price,...(x.a.cost!=null?{cost:x.a.cost}:{}),date:today(),cid:r.cid,rid:"",ret:m.id,who:"",paid:-r2(x.q*x.price*(tot?cashPart/tot:0))}))});
  tAll=r2(tAll);cAll=r2(cAll);const debtPart=r2(tAll-cAll);
  go();showR(r.id);note(cash?"Müşteriye iade edilecek para: "+fmtN(tAll)+" "+S.cur:"Veresiyeden düşüldü: "+fmtN(debtPart)+" "+S.cur+(cAll>0?"\nMüşteriye nakit iade edilecek para: "+fmtN(cAll)+" "+S.cur:""));
}

function cashMoves(){

  const U=(o)=>({...o,c:"USD"}),Z=(o)=>({...o,c:"UZS"});
  S.receipts.forEach(r=>{if(!num(r.paid))return;const b={d:r.date,t:r.time||"",txt:"Satış "+rNo(r)+(cname(r.cid)?" · "+cname(r.cid):""),on:`showR('${r.id}')`,ic:"cart"};

    if(r.paidU!=null||r.paidS!=null){if(num(r.paidU))E.push(U({...b,a:num(r.paidU)}));if(num(r.paidS))E.push(Z({...b,a:num(r.paidS)}));}
    else E.push(r.fx?Z({...b,a:num(r.change)>0?Math.round(num(r.paid)*num(r.fx.rate)):Math.round(num(r.fx.amt))}):U({...b,a:num(r.paid)}))});
  S.sales.filter(x=>!x.rid&&num(x.paid)).forEach(x=>E.push(U({d:x.date,t:"",a:num(x.paid),txt:(x.qty<0?"İade · ":"Satış · ")+pname(x.pid),on:x.ret&&S.receipts.some(r=>r.id===x.ret)?`showR('${x.ret}')`:"",ic:x.qty<0?"inb":"cart"})));
  S.payments.forEach(p=>{const b={d:p.date,t:p.time||"",txt:"Veresiye ödedi · "+(cname(p.cid)||"Müşteri")+(p.no||(p.alloc||[]).length?" · "+payNo(p):""),on:`showP('${p.id}')`,ic:"coin"};
    if(!isCash(p)){nc.push({...b,a:p.amount,pm:p.pm});return}
    E.push(p.fx?Z({...b,a:num(p.fx.amt)}):U({...b,a:p.amount}))});
  S.services.filter(x=>num(x.paid)).forEach(x=>E.push(U({d:x.st>=3&&x.done?x.done:x.date,t:"",a:num(x.paid),txt:"Tamir #"+x.no+" · "+(cname(x.cid)||""),on:`svcShow('${x.id}')`,ic:"tool"})));

  if(S.buyCash)S.buys.forEach(b=>E.push(U({d:b.date,t:"",a:-b.qty*b.cost,txt:"Mal alındı · "+pname(b.pid)+" × "+fmtN(b.qty),on:`editB('${b.id}')`,ic:"truck"})));
  (S.hand||[]).forEach(h=>{if(h.src==="own")return;const b={d:h.date,t:h.time||"",txt:(handWho(h)==="boss"?"Teslim edildi → ":"Pay verildi → ")+whoName(handWho(h)),on:`handShow('${h.id}')`,ic:"up",hand:1};E.push(h.fx?Z({...b,a:-num(h.fx.amt)}):U({...b,a:-h.amount}))});
  (S.cadj||[]).forEach(c=>{const b={d:c.date,t:c.time||"",a:c.amount,txt:"Sayılıp düzeltildi"+(c.note?" · "+c.note:""),on:"",ic:"note"};E.push(c.cur==="UZS"?Z(b):U(b))});
  (S.fxx||[]).forEach(x=>{const b={d:x.date,t:x.time||"",txt:"Değiştir · Kur "+fmtN(x.rate),on:`fxDel('${x.id}')`,ic:"note",ex:1};
    if(x.dir==="u2s"){E.push(U({...b,a:-num(x.usd)}));E.push(Z({...b,a:num(x.som)}))}else{E.push(Z({...b,a:-num(x.som)}));E.push(U({...b,a:num(x.usd)}))}});
  E.sort((a,b)=>(a.d+a.t).localeCompare(b.d+b.t));
  const B={USD:0,UZS:0};E.forEach(e=>{B[e.c]=e.c==="UZS"?Math.round(B[e.c]+e.a):r2(B[e.c]+e.a);e.bal=B[e.c]});

}

function PART(){
  if(S.part&&S.part.boss==="ئۈستۈنكى دەرىجە")S.part.boss="يېشىل";
  if(!S.part)S.part={boss:"يېشىل",shares:[{id:"me",name:"مەن",pct:25,me:true},{id:"a1",name:"ئابدۇۋەلى",pct:15}]};
  return S.part;

const bossPct=()=>Math.max(0,100-PART().shares.reduce((a,x)=>a+num(x.pct),0));
function whoName(id){const p=PART();return id==="boss"?p.boss:(p.shares.find(x=>x.id===id)||{}).name||"?"}
const handWho=h=>h.who||"boss";
function ledger(pred){
  pred=pred||(()=>true);
  const st=stats(d=>d&&pred(d)),prof=r2(st.kar),cogs=r2(st.cost),gid=r2(st.gider),net=r2(prof-gid),P_=PART();
  const paid=id=>(S.hand||[]).filter(h=>handWho(h)===id&&pred(h.date)).reduce((a,h)=>a+h.amount,0);
  const boss={id:"boss",name:P_.boss,pct:bossPct(),cogs,share:r2(net*bossPct()/100)};
  boss.earned=r2(boss.cogs+boss.share);boss.paid=r2(paid("boss"));boss.left=r2(boss.earned-boss.paid);
  const ps=P_.shares.map(x=>{const o={...x,share:r2(net*num(x.pct)/100),exp:0};o.earned=r2(o.share-o.exp);o.paid=r2(paid(x.id));o.left=r2(o.earned-o.paid);return o});
  return {st,prof,cogs,gid,net,boss,ps};
}

function capIn(){return r2((S.hand||[]).filter(h=>h.src==="own").reduce((a,h)=>a+num(h.amount),0))}
function bossDebt(){
  const P_=PART(),d0=P_.debt0d||"",has=P_.debt0!=null&&P_.debt0!=="",base=num(P_.debt0),useG=P_.debtGoods!==false;
  const goods=useG&&has?r2(S.buys.filter(b=>!b.bret&&b.who!==OPENW&&(!d0||b.date>=d0)).reduce((a,b)=>a+num(b.qty)*num(b.cost),0)):0;
  const ret=has?r2(-S.buys.filter(b=>b.bret&&(!d0||b.date>=d0)).reduce((a,b)=>a+num(b.qty)*num(b.cost),0)):0;
  const H=(S.hand||[]).filter(h=>handWho(h)==="boss"&&(!d0||h.date>=d0));
  const paid=r2(H.reduce((a,h)=>a+num(h.amount),0)),som=H.filter(h=>h.fx).reduce((a,h)=>a+num(h.fx.amt),0);
  const share=has?r2(ledger(d=>!d0||d>=d0).boss.share):0;
  return {has,base,d0,useG,goods,share,pct:bossPct(),paid,som,ret,left:r2(base+goods-ret-paid)};
}

async function upImg(file,max){

  const k=Math.min(1,max/Math.max(img.width,img.height)),cv=document.createElement("canvas");cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);
  cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);

  return (await AS.upload(blob,{type:"image/jpeg"})).id;
}

      for(const r of rows){

          continue;
        }

        const h=hs(JSON.stringify(r.data));

}

async function userEdit(id){
  if(!CUR||CUR.role!=="boss")return;
  const U=USERS(),u=id?U.find(x=>x.id===id):null,me=u&&u.id===CUR.id;
  const res=await dlgOpen(`<h3>${u?"Kullanıcıyı düzenle":"Yeni kişi ekle"}</h3>
   <form class="dform" onsubmit="event.preventDefault();dlgClose(Object.fromEntries(new FormData(this)))">
    <label>Adı<input name="n" required dir="auto" value="${esc(u?u.name:"")}"></label>
    <label>Yetkisi<select name="r"${me?" disabled":""} onchange="document.getElementById('upf').hidden=this.value==='boss'"><option value="staff"${!u||u.role!=="boss"?" selected":""}>Çalışan (satış, ürün, veresiye)</option><option value="boss"${u&&u.role==="boss"?" selected":""}>Patron (her şeyi görür)</option></select></label>
    <div id="upf" class="upf"${u&&u.role==="boss"?" hidden":""}><b>Bu kişi ne yapabilir?</b><small>Satış, ürünleri görme ve veresiye herkese açık. Aşağıdakileri kendiniz seçin:</small>
     ${PERMS.map(([k,l])=>`<label class="upc"><input type="checkbox" name="pm_${k}"${((u&&u.perm)||{})[k]?" checked":""}${k==="rep"?` onchange="if(this.checked)this.form.pm_cost.checked=true"`:k==="cost"?` onchange="if(!this.checked)this.form.pm_rep.checked=false"`:""}><span>${l}</span></label>`).join("")}
     <small>«Hesaplar ve raporlar»da kâr göründüğü için bunu verirseniz «Alış fiyatı» da birlikte açılır.</small></div>
    <label>${u?"Yeni şifre (değiştirmeyecekseniz boş bırakın)":"4 haneli şifre"}<input name="p" type="password" inputmode="numeric" maxlength="4" dir="ltr" autocomplete="off"${u?"":" required"}></label>
    <div class="row dbtn"><button class="btn">Kaydet</button>${u&&!me?`<button type="button" class="btn danger" onclick="dlgClose({del:1})">Sil</button>`:""}<button type="button" class="btn g" onclick="dlgClose(null)">Vazgeç</button></div></form>`);
  if(!res)return;
  if(res.del){if(!await ask(u.name+" silinsin mi? Artık uygulamaya giremez. Yaptığı kayıtlar korunur.","Sil",1))return;
    S.users=U.filter(x=>x.id!==u.id);go();toast("Silindi");return}
  const n=(res.n||"").trim(),p=String(res.p||"").replace(/\D/g,"");if(!n)return;
  if((p||!u)&&p.length!==4){await note("Şifre 4 haneli bir sayı olsun.");return userEdit(id)}
  const perm={};PERMS.forEach(([k])=>{if(res["pm_"+k])perm[k]=true});if(perm.rep)perm.cost=true;
  if(u){u.name=n;if(!me){u.role=res.r==="boss"?"boss":"staff";u.perm=perm}if(p)u.pinh=pinH(u.id,p)}
  else{const nid=uid();S.users=[...U,{id:nid,name:n,role:res.r==="boss"?"boss":"staff",perm,pinh:pinH(nid,p)}]}
  if(me)CUR=u;go();toast("Kaydedildi");
}

/* ---------- Ortak veritabanı: üç kişi Gmail siz aynı verileri görürsünüz ---------- */
const TEAM=window.TEAM=(()=>{
  const active=(typeof fetch==="function")&&!/(^|\.)claude\.ai$/.test(location.hostname)&&!/^(claude|artifacts?)\./.test(location.hostname)&&!/claudeusercontent/.test(location.hostname);
  const ID="main",H={apikey:SB_KEY,"Content-Type":"application/json"};
  let busy=false,again=false,poll=null,dT=null,err="",lastOk="",rT=0,started=false;
  try{rT=+localStorage.getItem(KEY+"-sht")||0}catch(e){}
  const url=q=>SB_URL+"/rest/v1/shop_state"+q;
  async function j(r){if(!r.ok){const e=new Error("HTTP "+r.status);e.status=r.status;throw e}return r.json()}
  const getT=()=>fetch(url("?id=eq."+ID+"&select=t"),{headers:H}).then(j).then(a=>a[0]||null);
  const getAll=()=>fetch(url("?id=eq."+ID+"&select=s,t"),{headers:H}).then(j).then(a=>a[0]||null);
  const rd=id=>{const e=document.getElementById(id);try{return e?JSON.parse(e.textContent):null}catch(x){return null}};
  const cp=o=>JSON.parse(JSON.stringify(o));
  const cnt=o=>{let n=0;for(const k in o||{})if(Array.isArray(o[k]))n+=o[k].length;return n};
  const bad=(a,b)=>{const x=cnt(b);return x>=20&&cnt(a)<x*0.8};
  async function daily(js){
    const d=today();let f="";try{f=localStorage.getItem(KEY+"-shbak")}catch(e){}
    if(f===d)return;
    try{const r=await fetch(url("?on_conflict=id"),{method:"POST",headers:{...H,Prefer:"resolution=ignore-duplicates,return=minimal"},body:JSON.stringify({id:"bak-"+d,s:js,t:Date.now(),by:DEV,updated_at:new Date().toISOString()})});
      if(r.ok)localStorage.setItem(KEY+"-shbak",d)}catch(e){}
  }
  function keep(js,t){rT=t;try{localStorage.setItem(KEY+"-shbase",js);localStorage.setItem(KEY+"-sht",String(t))}catch(e){}}
  const getBase=()=>{try{const b=localStorage.getItem(KEY+"-shbase");if(b)return JSON.parse(b)}catch(e){}return rd("seeddata")};
  function put(js){try{localStorage.setItem(KEY,js)}catch(e){}}
  function show(){const m=$("#msg");if(m&&!m.dataset.err)m.innerHTML=err?`<span style="color:#e0a050">${esc(err)}</span>`:"";if(tab==="ayar"){const el=$("#syncbox");if(el)el.outerHTML=box()}}
  function msg(){return err}
  async function run(){
    if(!active)return;
    if(busy){again=true;return}
    busy=true;
    try{
      for(let i=0;i<6;i++){
        const r=await getAll();
        let L=cp(S),B=getBase(),Rd=null;
        if(r){try{Rd=JSON.parse(r.s)}catch(e){throw new Error("bad")}}
        if(!r){
          /* Bulut boş: en yeni sürüm + bu telefondaki değişiklik */
          const I=rd("initdata"),Bs=rd("seeddata");
          const m=I?(Bs?merge3(Bs,L,I):I):L;
          adopt(m);const js=JSON.stringify(S);
          const t=Date.now();
          const res=await fetch(url("?on_conflict=id"),{method:"POST",headers:{...H,Prefer:"resolution=ignore-duplicates,return=representation"},body:JSON.stringify({id:ID,s:js,t,by:DEV,updated_at:new Date().toISOString()})}).then(j);
          if(res.length){keep(js,t);put(js);softRender();break}
          continue;
        }
        if(r.t!==rT||!localStorage.getItem(KEY+"-shbase")){
          /* Diğer telefonun değişikliği var: üç yönlü birleştirme */
          try{localStorage.setItem(KEY+"-prelink",JSON.stringify(L))}catch(e){}
          const M=B?merge3(B,L,Rd):Rd;
          if(bad(M,Rd))throw new Error("guard-merge");
          const before=JSON.stringify(S);
          adopt(M);
          keep(r.s,r.t);put(JSON.stringify(S));
          if(JSON.stringify(S)!==before)softRender();
        }
        const js=JSON.stringify(S),bs=localStorage.getItem(KEY+"-shbase");
        if(js===bs){daily(r.s);break}
        /* Yerel değişiklik var: üstüne yaz (eşzamanlılık kontrolüyle kaydet) */
        if(bad(S,Rd||JSON.parse(r.s)))throw new Error("guard-push");
        await daily(r.s);
        const t=Math.max(Date.now(),r.t+1);
        const res=await fetch(url("?id=eq."+ID+"&t=eq."+r.t),{method:"PATCH",headers:{...H,Prefer:"return=representation"},body:JSON.stringify({s:js,t,by:DEV,updated_at:new Date().toISOString()})}).then(j);
        if(res.length){keep(js,t);break}
        await sleep(200+Math.random()*400);
      }
      err="";lastOk=today()+" "+nowT();photos();
    }catch(e){err=/^guard/.test(e.message)?"Veri azalması riski tespit edildi — Eşitleme durduruldu, korundu. Muhammed kişisine söyleyin":navigator.onLine===false||!e.status?"İnternet yok — Değişiklikler telefonda saklandı, internet gelince otomatik eşitlenecek":"Eşitlemede hata ("+e.message+")"}
    busy=false;show();
    if(again){again=false;setTimeout(run,300)}
  }
  /* Fotoğraflar: tüm telefonlar ortak depolama alanına yükler ve eksikleri indirir */
  let pUp=new Set(),pMiss={},pInfo="";try{pUp=new Set(JSON.parse(localStorage.getItem(KEY+"-shph")||"[]"))}catch(e){}
  const pids=()=>{const q=new Set();(S.customers||[]).forEach(c=>{if(c.img)q.add(c.img);(c.photos||[]).forEach(x=>x&&x.id&&q.add(x.id))});(S.products||[]).forEach(x=>{if(x.img)q.add(x.img)});return [...q]};
  const pvSave=()=>{try{localStorage.setItem(KEY+"-shph",JSON.stringify([...pUp]))}catch(e){}};
  let pBusy=false;
  async function photos(){
    if(pBusy||!AS||!AS.put)return;pBusy=true;let got=false,up=0,dn=0,fail=0;
    try{
      const ids=pids();
      for(const id of ids){
        const path=SB_URL+"/storage/v1/object/gelone/"+encodeURIComponent(id);
        if(window.__BU[id]){
          if(pUp.has(id))continue;
          try{const b=await AS.getBlob(id);if(!b)continue;
            const r=await fetch(path,{method:"POST",headers:{apikey:SB_KEY,"Content-Type":b.type||"image/jpeg","x-upsert":"false"},body:b});
            if(r.ok||r.status===409||r.status===400){const t=r.ok?"":await r.text().catch(()=>"");if(r.ok||/exist|Duplicate/i.test(t)||r.status===409){pUp.add(id);pvSave();up++}else fail++}else fail++}catch(e){fail++}
        }else if(!(pMiss[id]>Date.now())){
          try{const r=await fetch(SB_URL+"/storage/v1/object/public/gelone/"+encodeURIComponent(id));
            if(r.ok){const b=await r.blob();await AS.put(id,b);pUp.add(id);pvSave();got=true;dn++}else pMiss[id]=Date.now()+60000}catch(e){pMiss[id]=Date.now()+60000}
        }
      }
      const have=ids.filter(i=>window.__BU[i]).length;
      pInfo=`${have}/${ids.length}`+(fail?` (yüklenemedi: ${fail})`:"");
    }catch(e){}
    pBusy=false;if(got)softRender();
  }
  function dirty(){if(!active)return;clearTimeout(dT);dT=setTimeout(run,800)}
  function start(){
    if(!active||started)return;started=true;
    run();
    poll=setInterval(async()=>{if(document.hidden||busy)return;try{const x=await getT();if(x&&x.t!==rT)run();else if(err)run()}catch(e){}},4000);
    document.addEventListener("visibilitychange",()=>{if(!document.hidden)run()});
    window.addEventListener("online",()=>run());
  }
  function box(){
    return `<div class="card" id="syncbox"><h2>Ortak veritabanı</h2><div class="foot" style="margin-bottom:10px">Tüm telefonlar aynı verileri görür. Değişiklik birkaç saniyede diğer telefonlara ulaşır. Gmail gerekmez.</div><dl class="kv"><dt>Durumu</dt><dd>${err?esc(err):"Bağlı ✓"}</dd><dt>Son eşitleme</dt><dd>${lastOk?`<span dir="ltr">${esc(lastOk)}</span>`:"—"}</dd><dt>Fotoğraflar</dt><dd dir="ltr" style="text-align:left">${esc(pInfo||"—")}</dd></dl><div class="row"><button class="btn" onclick="TEAM.run()">Şimdi eşitle</button></div></div>`;
  }
  return {active,run,dirty,start,box,msg};
})();

window.addEventListener("error",e=>{try{const m=document.getElementById("msg");if(m){m.dataset.err=1;m.textContent="Hata: "+(e.message||"")+" @"+(e.lineno||"")}}catch(x){}});
window.addEventListener("unhandledrejection",e=>{try{const m=document.getElementById("msg");if(m&&!m.textContent){m.dataset.err=1;m.textContent="Hata: "+(e.reason&&e.reason.message||e.reason)}}catch(x){}});
/* ---------- başlangıç ---------- */
{const st=document.createElement("style");st.textContent=FISCSS;document.head.appendChild(st)}
window.__AMBUSE("assets").then(async a=>{AS=a;
  try{const e=document.getElementById("seedphotos");if(e&&a.load&&localStorage.getItem(KEY+"-seedph")!=="20261108"){const o=JSON.parse(e.textContent),m={};for(const k in o)if(!window.__BU[k])m[k]=o[k];if(Object.keys(m).length)await a.load(m);localStorage.setItem(KEY+"-seedph","20261108")}}catch(x){}
  render()}).catch(()=>{});
try{adopt(JSON.parse(localStorage.getItem(KEY)))}catch(e){}
try{var _sd=document.getElementById("seeddata");if(_sd&&localStorage.getItem(KEY+"-seed")!=="20261106-cloud"){adopt(JSON.parse(_sd.textContent));localStorage.setItem(KEY+"-seed","20261106-cloud");try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}}catch(e){}
applyTheme();
authCheck(false);
render();SYNC.msgLine();SYNC.start();TEAM.start();
(async()=>{
  try{
    const db=await claude.use("db"),user=await claude.use("user");

      else{adopt(m);docRef=ref;await saveRemote()}}

    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")saveRemote()});
  }catch(e){SYNC.msgLine()}
})().finally(()=>authCheck(true));
setTimeout(()=>authCheck(true),8000);
